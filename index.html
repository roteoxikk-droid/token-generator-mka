<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generator Tokenów</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-dark: #09020e; 
            --bg-mid: #00e04b44; 
            --text-light: #eeeeee;
            --text-subtle: #777777;
            --glass-fill: rgba(255, 255, 255, 0.05); 
            --border-clear: rgba(0, 255, 76, 0.377); 
            --accent-green: #0dbba1; 
            --accent-glow: rgba(0, 247, 103, 0.6);
            --shadow-button: rgba(0, 255, 85, 0.4);
            --error-red: #ff3333; 
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 15px;
            box-sizing: border-box;
            background-image: radial-gradient(circle at top left, var(--bg-mid) 5%, transparent 40%),
                              radial-gradient(circle at bottom right, rgba(0, 255, 76, 0.1) 0%, transparent 45%);
            background-attachment: fixed;
            background-size: cover;
        }

        #appContent, #loginCard {
            width: 100%;
            max-width: 400px;
        }

        .card {
            background: var(--glass-fill);
            backdrop-filter: blur(20px) brightness(1.1);
            -webkit-backdrop-filter: blur(20px) brightness(1.1);
            padding: 25px; 
            border-radius: 24px; 
            border: 1px solid var(--border-clear);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 20px var(--accent-glow) inset;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        h2, h3 {
            color: var(--text-light);
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--accent-green);
            margin-top: 0;
        }

        h2 {
            font-size: 1.5rem;
            text-align: center;
            border-bottom: 1px solid var(--border-clear);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        h3 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            margin-top: 10px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-subtle);
            font-size: 0.85rem;
        }

        input[type="email"], 
        input[type="password"], 
        input[type="number"], 
        input[type="datetime-local"] {
            width: 100%;
            padding: 14px 14px;
            border: 1px solid var(--border-clear);
            border-radius: 12px;
            box-sizing: border-box;
            background-color: rgba(0, 0, 0, 0.5);
            color: var(--text-light);
            transition: border-color 0.3s, box-shadow 0.3s;
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 18px;
            -webkit-appearance: none;
            appearance: none;
            font-family: inherit;
        }

        input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 4px var(--accent-glow);
            background-color: var(--bg-mid);
        }

        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        ::placeholder {
            color: var(--text-subtle);
            opacity: 0.8; 
        }

        button {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            transition: all 0.2s ease;
            background-color: var(--accent-green);
            color: var(--text-light);
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            box-shadow: 0 4px 20px var(--shadow-button);
        }

        button:hover:not([disabled]) {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        button.copy {
            background-color: rgba(0, 255, 76, 0.2);
            border: 1px solid var(--border-clear);
            color: #33ff77;
            margin-top: 12px;
            padding: 12px;
            font-size: 0.85rem;
            box-shadow: none;
        }

        button.copy:hover {
            background-color: rgba(0, 255, 76, 0.35);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        button.logout {
            background: rgba(255, 51, 51, 0.15);
            border: 1px solid rgba(255, 51, 51, 0.4);
            color: var(--error-red);
            margin-top: 25px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            padding: 12px;
            box-shadow: none;
        }

        button.logout:hover {
            background: rgba(255, 51, 51, 0.3);
            box-shadow: 0 0 12px rgba(255, 51, 51, 0.4);
        }

        .token-item {
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--text-light);
            word-break: break-all;
        }

        .token-item strong {
            color: var(--accent-green);
        }

        #appContent { display: none; }
    </style>
</head>
<body>

    <!-- EKRAN LOGOWANIA -->
    <div id="loginCard" class="card">
        <h2>Logowanie</h2>
        <form id="loginForm">
            <label>Email:</label>
            <input type="email" id="emailInput" placeholder="twoj@email.com" required autocapitalize="none" autocorrect="off">
            
            <label>Hasło:</label>
            <input type="password" id="passInput" placeholder="Twoje hasło" required autocapitalize="none" autocorrect="off">
            
            <button type="submit" id="loginBtn">Zaloguj się</button>
        </form>
    </div>

    <!-- GŁÓWNA APLIKACJA -->
    <div id="appContent">
        <div class="card">
            <h2>Nowy Token</h2>
            <form id="tokenForm">
                <label>Pozostałe użycia (uses_left):</label>
                <input type="number" id="usesLeft" value="1" required>

                <label>Wygasa (expires_at):</label>
                <input type="datetime-local" id="expiresAt" required>

                <button type="submit" id="submitBtn">Generuj i Zapisz</button>
            </form>
        </div>

        <h3>Ostatnie Tokeny</h3>
        <div id="tokenList">Ładowanie...</div>

        <button class="logout" onclick="logout()">Wyloguj się</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://rpmxzjdqcncwmjbegvld.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwbXh6amRxY25jd21qYmVndmxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTAxNTIsImV4cCI6MjEwMzQyNjE1Mn0.5Vl--_6IGK546mZPvzVujkWjscYzQmfzjnXeROBx3pE';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                showApp();
            }
        }
        checkSession();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerText = 'Logowanie...';

            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passInput').value.trim();

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            btn.disabled = false;
            btn.innerText = 'Zaloguj się';

            if (error) {
                alert('Błąd logowania: ' + error.message);
            } else {
                showApp();
            }
        });

        function showApp() {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
            fetchTokens();
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        function generateRandomToken() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const segment = () => Array.from({ length: 4 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
            return `${segment()}-${segment()}-${segment()}-${segment()}`;
        }

        async function fetchTokens() {
            const listDiv = document.getElementById('tokenList');
            const { data, error } = await supabaseClient.from('tokens').select('*').order('id', { ascending: false }).limit(10);
            
            if (error) {
                listDiv.innerHTML = '<p style="color:var(--error-red);">Błąd pobierania danych: ' + error.message + '</p>';
                return;
            }

            if (data.length === 0) {
                listDiv.innerHTML = '<p style="color:var(--text-subtle);">Brak tokenów w bazie.</p>';
                return;
            }

            listDiv.innerHTML = data.map(t => `
                <div class="card">
                    <div class="token-item"><strong>Link:</strong> https://roteoxikk-droid.github.io</div>
                    <div class="token-item"><strong>Token:</strong> ${t.token}</div>
                    <div class="token-item" style="color: var(--text-subtle); font-size: 0.75rem;">Użycia: ${t.uses_left} | Wygasa: ${new Date(t.expires_at).toLocaleString()}</div>
                    <button class="copy" onclick="copyToken('${t.token}')">Skopiuj gotowy tekst</button>
                </div>
            `).join('');
        }

        document.getElementById('tokenForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Zapisywanie...';

            const newToken = generateRandomToken();
            const uses = parseInt(document.getElementById('usesLeft').value, 10);
            const expires = new Date(document.getElementById('expiresAt').value).toISOString();

            const { error } = await supabaseClient.from('tokens').insert([
                { token: newToken, uses_left: uses, expires_at: expires }
            ]);

            btn.disabled = false;
            btn.innerText = 'Generuj i Zapisz';

            if (error) {
                alert('Błąd zapisu w bazie: ' + error.message);
            } else {
                document.getElementById('usesLeft').value = '1';
                document.getElementById('expiresAt').value = '';
                fetchTokens();
            }
        });

        function copyToken(token) {
            const text = `Link: https://roteoxikk-droid.github.io\nToken: ${token}`;
            navigator.clipboard.writeText(text).then(() => {
                alert('Skopiowano do schowka!');
            });
        }
    </script>
</body>
</html>
